name: safeguard
description: SafeGuard — personal safety & emergency alert app (Flutter port).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Backend (matches the Supabase backend used by the original app)
  supabase_flutter: ^2.5.6

  # Routing
  go_router: ^14.2.0

  # Location
  geolocator: ^13.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Sensors — used for iOS shake-to-SOS
  sensors_plus: ^6.0.1

  # Voice commands (SOS trigger phrase detection)
  speech_to_text: ^7.0.0

  # Video recording (Recording Panel)
  camera: ^0.11.0

  # Device file upload (Recording Panel)
  file_picker: ^10.3.10

  # Local notifications (fake call / alerts)
  flutter_local_notifications: ^17.2.2

  # Permissions
  permission_handler: ^11.3.1

  # Audio (evidence recording, panic siren)
  record: ^6.0.0
  audioplayers: ^6.0.0

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
